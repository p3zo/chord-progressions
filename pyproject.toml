[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-progressions"
dynamic = ["version"]
description = "A Python package for working with chord progressions "
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "p3zo", email = "p3zo@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "matplotlib>=3.9.2,<4",
    "mido>=1.3.3,<2",
    "music21>=10,<11",
    "networkx>=3.4,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<3",
    "pretty_midi>=0.2.11.post0,<0.3",
    "scipy>=1.14.1,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["chord_progressions", "chord_progressions.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "chord_progressions.__version__"}

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "flake8", "ipdb", "ipython", "isort", "bump-my-version", "mkdocs-material"]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/p3zo/chord-progressions"
Issues = "https://github.com/p3zo/chord-progressions/issues"

[tool.bumpversion]
current_version = "0.39.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "chord_progressions/__init__.py"
