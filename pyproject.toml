[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-progressions"
dynamic = ["version"]
description = "A Python package for working with chord progressions "
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "p3zo", email = "p3zo@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "matplotlib>=3.9.2,<4",
    "mido>=1.3.3,<2",
    "music21>=10,<11",
    "networkx>=3.4,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<3",
    "pretty_midi>=0.2.11.post0,<0.3",
    "scipy>=1.14.1,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["chord_progressions", "chord_progressions.*"]
namespaces = false

# The version comes from the latest vX.Y.Z git tag; CI creates that tag on every merge to main.
[tool.setuptools_scm]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "flake8", "ipdb", "ipython", "isort", "mkdocs-material"]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/p3zo/chord-progressions"
Issues = "https://github.com/p3zo/chord-progressions/issues"
